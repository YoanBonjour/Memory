<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Memory Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
  </head>
  <body>
    <div class="menu">
      <h1 class="menu-title">Bienvenue !</h1>
      <div class="menu-select">
        <p class="menu-text">
          Sélectionne le mode de jeu et la difficulté que tu veux
        </p>

        <input type="range" id="monRange" min="0" max="100" value="50" />
        <div class="menu-btn">
          <div class="menu-btn-players">
            <label class="btn" id="menu-btn-solo">
              <input
                type="radio"
                name="players-select"
                value="solo"
                class="menu-hidden"
              />
              <span>Solo</span>
            </label>
            <label class="btn" id="menu-btn-duo">
              <input
                type="radio"
                name="players-select"
                value="duo"
                class="menu-hidden"
              />
              <span>Duo</span>
            </label>
          </div>
          <button class="menu-btn-start btn-disabled">Commencer</button>
        </div>
      </div>
    </div>
    <div id="content-game">
      <p id="attempts"></p>
      <p id="cheat"></p>
      <p class="score-max"><span id="score"></span>/12</p>
      <div id="board"></div>
      <div id="first-player"></div>
      <div id="score-first-player"></div>
      <button id="btn-restart">Recommencer</button>
      <div id="second-player"></div>
      <div id="score-second-player"></div>
      <span id="affichage"></span>
    </div>
    <script src="js/main.js" type="module"></script>
  </body>
</html>
