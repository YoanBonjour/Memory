<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Memory Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="scss/main.scss" />
  </head>
  <body>
    <div class="menu">
      <h1>Bienvenue !</h1>
      <p>Sélectionne le mode de jeu et la difficulté que tu veux</p>
      <input type="range" id="monRange" min="0" max="100" value="50" />
      <div class="menu-btn">
        <div class="menu-btn-players">
          <button id="menu-btn-solo">Solo</button>
          <button id="menu-btn-duo">Duo</button>
        </div>
        <button class="menu-btn-start">Commencer</button>
      </div>
    </div>
    <div id="content-game">
      <p id="attempts"></p>
      <p id="cheat"></p>
      <p class="score-max"><span id="score"></span>/12</p>
      <div id="board"></div>
      <div id="first-player"></div>
      <div id="score-first-player"></div>
      <button id="btn-restart">Recommencer</button>
      <div id="second-player"></div>
      <div id="score-second-player"></div>
      <span id="affichage"></span>
    </div>
    <script src="js/main.js" type="module"></script>
  </body>
</html>
